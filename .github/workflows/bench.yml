name: bench

on:
  push:
  workflow_dispatch:

env:
  COMPOSE_FILE: compose.yaml
  COMPOSE_PROJECT_NAME: nrb2026

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Cache fixtures
        id: cache-fixtures
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: bench/fixtures/images
          key: bench-fixtures-v1-${{ hashFiles('scripts/fetch-bench-fixtures.sh') }}

      - name: Download fixtures
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        run: scripts/fetch-bench-fixtures.sh

      - name: Build webapp
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: webapp/Dockerfile
          load: true
          tags: ${{ env.COMPOSE_PROJECT_NAME }}-webapp:latest
          cache-from: type=gha,scope=webapp
          cache-to: type=gha,scope=webapp,mode=max

      - name: Build bench
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: bench/Dockerfile
          load: true
          tags: ${{ env.COMPOSE_PROJECT_NAME }}-bench:latest
          cache-from: type=gha,scope=bench
          cache-to: type=gha,scope=bench,mode=max

      - name: Start services
        run: docker compose up -d --no-build mysql webapp

      - name: Wait for webapp
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "webapp ready"
              exit 0
            fi
            sleep 2
          done
          echo "webapp not ready within timeout" >&2
          exit 1

      - name: Run bench
        continue-on-error: true
        run: |
          docker compose run --rm -T bench | tee /tmp/bench-stdout.txt

      - name: Show result
        run: |
          cat /tmp/bench-stdout.txt | jq .
